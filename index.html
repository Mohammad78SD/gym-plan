<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>برنامه تمرینی محمد و مهدی</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f6f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1214" media="(prefers-color-scheme: dark)">
<meta name="description" content="برنامه تمرینی ماه اول محمد و مهدی: ۳ جلسه در هفته، ثبت ست و وزنه، تایمر استراحت">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="باشگاه">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Crect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%2340d9c0%22/%3E%3Crect x=%2218%22 y=%2244%22 width=%2264%22 height=%2212%22 rx=%224%22 fill=%22%230e1214%22/%3E%3Crect x=%2214%22 y=%2230%22 width=%2214%22 height=%2240%22 rx=%224%22 fill=%22%230e1214%22/%3E%3Crect x=%2272%22 y=%2230%22 width=%2214%22 height=%2240%22 rx=%224%22 fill=%22%230e1214%22/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  --bg:#f4f6f7;--card:#ffffff;--ink:#12171b;--muted:#566069;--line:#dde2e6;
  --accent:#0b7a6f;--accent-ink:#ffffff;--accent-soft:#e0f3f0;--warn:#b45309;--warn-soft:#fdf0dc;
  --fig:#27303a;--figfar:#aab3bb;--fl:#c4ccd3;--fbg:#eef3f4;
  --shadow:0 1px 2px rgba(0,0,0,.06);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0e1214;--card:#171c20;--ink:#eef2f4;--muted:#9ba7b0;--line:#2a3238;
    --accent:#3fd6c4;--accent-ink:#04201c;--accent-soft:#123029;--warn:#f0b35a;--warn-soft:#33260f;
    --fig:#e8edf0;--figfar:#5b6670;--fl:#3b454d;--fbg:#1d2429;
    --shadow:none;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Vazirmatn',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;font-size:16px;line-height:1.7;padding-bottom:120px;overflow-x:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
header{padding:20px 0 8px}
header h1{margin:0;font-size:22px;font-weight:800;line-height:1.4}
header p{margin:2px 0 0;color:var(--muted);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
.ctl{margin:12px 0;display:grid;gap:12px}
.lbl{font-size:13px;color:var(--muted);margin:0 0 6px;font-weight:600}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:4px}
.seg button{min-height:46px;border:0;border-radius:9px;background:transparent;font-weight:600;font-size:16px}
.seg button[aria-pressed="true"],.seg button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.rir{margin-top:10px;background:var(--accent-soft);border-radius:12px;padding:10px 12px;font-size:14.5px}
.rir b{font-weight:800}
.rir small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.tabs{position:sticky;top:0;z-index:20;background:var(--bg);padding:8px 0;border-bottom:1px solid var(--line)}
.tabs .seg{grid-auto-flow:column}
.tabs .seg button{font-size:15px;padding:0 4px}
.dayhead{margin:16px 0 8px}
.dayhead h2{margin:0;font-size:18px;font-weight:800;line-height:1.5}
.dayhead p{margin:0;color:var(--muted);font-size:13.5px}
.prog{margin:10px 0 14px}
.prog .row{display:flex;justify-content:space-between;font-size:14px;font-weight:600}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.ex{margin:0 0 12px}
.ex .top{display:flex;gap:10px;align-items:flex-start}
.num{flex:none;width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800;font-size:15px}
.names{min-width:0;flex:1}
.names h3{margin:0;font-size:18px;font-weight:800;line-height:1.5}
.names .en{direction:ltr;text-align:right;font-size:12.5px;color:var(--muted);overflow-wrap:anywhere;line-height:1.4}
.mid{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;align-items:center}
.figs{display:flex;gap:8px;flex-wrap:wrap}
.fig{width:140px;height:100px;background:var(--fbg);border-radius:12px;flex:none}
.meta{flex:1;min-width:130px;display:grid;gap:4px}
.meta .big{font-size:19px;font-weight:800}
.meta .sm{font-size:14px;color:var(--muted)}
.chip{display:inline-block;background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:0 8px;font-size:12.5px;font-weight:600}
.note{margin:10px 0 0;font-size:14.5px;color:var(--ink)}
.last{font-size:13px;color:var(--accent);font-weight:600}
.bubs{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.bub{width:48px;height:48px;border-radius:50%;border:2px solid var(--accent);background:transparent;color:var(--accent);font-weight:800;font-size:17px}
.bub.on{background:var(--accent);color:var(--accent-ink)}
.logs{display:flex;gap:8px;margin-top:10px}
.logs label{flex:1;display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:10px;padding:0 10px;min-height:46px;background:var(--bg);font-size:13.5px;color:var(--muted)}
.logs input{width:100%;min-width:0;border:0;background:transparent;font-size:17px;font-weight:600;text-align:center;direction:ltr;min-height:44px;outline:none}
.logs label:focus-within{border-color:var(--accent)}
.cardio{border-style:dashed}
.cardio h3{margin:0 0 4px;font-size:16px}
.cardio p{margin:0;font-size:14.5px}
.dayfoot{margin:16px 0}
.btn{min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--card);padding:0 16px;font-weight:600}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.dng{background:var(--warn);color:#fff;border-color:var(--warn)}
.conf{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14.5px}
.conf span{flex:1 1 100%}
details.card{margin:0 0 10px;padding:0}
details summary{list-style:none;padding:14px;font-weight:800;font-size:17px;min-height:48px;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
details summary::-webkit-details-marker{display:none}
details summary::after{content:'+';font-size:22px;color:var(--accent);font-weight:400}
details[open] summary::after{content:'−'}
details .in{padding:0 14px 14px;font-size:15px}
.in ul,.in ol{margin:6px 0;padding-inline-start:22px}
.in li{margin:4px 0}
.in h4{margin:12px 0 4px;font-size:15px}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 12px;border-top:1px solid var(--line);padding:8px 0}
.kv:first-of-type{border-top:0}
.kv b{font-weight:600}
.kv span{color:var(--accent);font-weight:600;text-align:left}
.rt{border-top:1px solid var(--line);padding:10px 0}
.rt:first-of-type{border-top:0}
.rt .h{display:flex;justify-content:space-between;gap:8px;font-weight:800}
.rt .h span{color:var(--accent);font-weight:600;white-space:nowrap;font-size:14px}
.rt p{margin:2px 0 0;color:var(--muted);font-size:14px}
.rt .fg2{display:flex;gap:8px;margin-top:6px}
.disc{font-size:12.5px;color:var(--muted);margin:18px 0}
.tbar{position:fixed;inset-inline:0;bottom:0;z-index:30;background:var(--card);border-top:2px solid var(--accent);padding:10px 16px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -4px 16px rgba(0,0,0,.12)}
.tbar[hidden]{display:none}
.tin{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:10px}
.tin .t{flex:1;min-width:0}
.tin .t small{display:block;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tin .t b{font-size:28px;font-weight:800;line-height:1.2;font-variant-numeric:tabular-nums}
.tin .bar{margin-top:4px;height:6px}
.tbar.done{background:var(--accent);color:var(--accent-ink)}
.tbar.done .t small{color:var(--accent-ink)}
.tbar.done .bar{background:rgba(255,255,255,.35)}
.tbar.done .bar i{background:var(--accent-ink)}
/* figures */
.fig .b{stroke:var(--fig);stroke-width:4;stroke-linecap:round;fill:none}
.fig .far{stroke:var(--figfar);stroke-width:4;stroke-linecap:round;fill:none}
.fig .fl{stroke:var(--fl);stroke-width:2.5;stroke-linecap:round;fill:none}
.fig .pad{stroke:var(--fl);stroke-width:7;stroke-linecap:round;fill:none}
.fig .hd{fill:var(--fbg);stroke:var(--fig);stroke-width:3}
.fig .eq{fill:var(--accent);stroke:none}
.fig .eqp{stroke:var(--accent);stroke-width:5;stroke-linecap:round;fill:none}
.fig .cb{stroke:var(--accent);stroke-width:1.5;fill:none;vector-effect:non-scaling-stroke}
.fig .fg{transform-box:view-box;animation-duration:var(--dur,3s);animation-timing-function:ease-in-out;animation-iteration-count:infinite}
@media (prefers-reduced-motion: reduce){
  .fig .fg{animation-play-state:paused}
  .bar i{transition:none}
}
@media (max-width:380px){.fig{width:128px;height:92px}.bub{width:46px;height:46px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>برنامه تمرینی محمد و مهدی</h1>
    <p>ماه اول · چربی‌سوزی و عضله‌سازی · شروع: ۱۹ مهر ۱۴۰۵ (<bdi dir="ltr">۲۰۲۶-۱۰-۱۱</bdi>)</p>
  </header>
  <section class="card ctl" aria-label="تنظیمات">
    <div>
      <p class="lbl">کی تمرین می‌کنه؟</p>
      <div class="seg" id="segPerson" role="group" aria-label="انتخاب نفر"></div>
    </div>
    <div>
      <p class="lbl">هفته</p>
      <div class="seg" id="segWeek" role="group" aria-label="انتخاب هفته"></div>
      <div class="rir" id="rir"></div>
    </div>
  </section>
  <nav class="tabs"><div class="seg" id="segDay" role="tablist" aria-label="روز تمرین"></div></nav>
  <main id="app"></main>
  <p class="disc">این برنامه راهنمای عمومی تمرین است و توصیه‌ی پزشکی نیست. اگر درد کمر به پا کشید یا بی‌حسی و مورمور داشتی، تمرین را قطع کن و پیش دکتر یا فیزیوتراپ برو.</p>
</div>
<div class="tbar" id="tbar" hidden role="timer" aria-live="off">
  <div class="tin">
    <div class="t"><small id="tname"></small><b id="ttime">۰۰:۰۰</b><div class="bar"><i id="tfill"></i></div></div>
    <button class="btn" id="tadd" data-act="tadd">+۱۵ ثانیه</button>
    <button class="btn pri" id="tstop" data-act="tstop">توقف</button>
  </div>
</div>

<script>
'use strict';
/* ================= figure engine ================= */
const R=Math.PI/180;
const n1=v=>+(+v).toFixed(1);
const ln=(x1,y1,x2,y2,c)=>`<line class="${c||'fl'}" x1="${n1(x1)}" y1="${n1(y1)}" x2="${n1(x2)}" y2="${n1(y2)}"/>`;
const ci=(x,y,r,c)=>`<circle class="${c||'fl'}" cx="${n1(x)}" cy="${n1(y)}" r="${r}"/>`;
const F=(y)=>ln(8,y==null?92:y,132,y==null?92:y,'fl');
const hd=(e,a)=>ci(e[0]+5*Math.sin(a*R),e[1]-5*Math.cos(a*R),5,'hd');
const wt=r=>e=>ci(e[0],e[1],r,'eq');
const stand=(cx)=>ln(cx,46,cx,18,'b')+ln(cx,46,cx+1,68,'b')+ln(cx+1,68,cx,90,'b')+ln(cx-6,90,cx+10,90,'b');

function fk(nodes,pose){
  const abs={},end={},org={},by={};
  nodes.forEach(n=>{
    by[n.id]=n;const p=n.p?by[n.p]:null;let o;
    if(p)o=end[p.id];else{o=n.at.slice();const t=pose&&pose.tr&&pose.tr[n.id];if(t){o[0]+=t[0];o[1]+=t[1];}}
    org[n.id]=o;
    let a;
    if(!pose)a=n.a;
    else if(n.rel)a=abs[p.id]+(n.a-p.a);
    else a=(pose.a&&pose.a[n.id]!=null)?pose.a[n.id]:n.a;
    abs[n.id]=a;
    end[n.id]=[o[0]+n.len*Math.sin(a*R),o[1]-n.len*Math.cos(a*R)];
  });
  return{abs,end,org};
}

function build(name,d){
  const N=d.nodes,Ps=d.poses,ref=fk(N,null),fr=Ps.map(p=>fk(N,p));
  const by={};N.forEach(n=>by[n.id]=n);
  const kf=(nm,fs)=>`@keyframes ${nm}{${fs.join('')}}`;
  let css='';const moving={};
  N.forEach(n=>{
    const p=n.p?by[n.p]:null;
    const rs=fr.map(f=>(f.abs[n.id]-ref.abs[n.id])-(p?(f.abs[p.id]-ref.abs[p.id]):0));
    const tr=Ps.map(q=>(q.tr&&q.tr[n.id])||[0,0]);
    if(rs.some(v=>Math.abs(v)>.01)||tr.some(t=>t[0]||t[1])){
      moving[n.id]=1;
      css+=kf(`${name}_${n.id}`,Ps.map((q,i)=>`${q.t}%{transform:translate(${tr[i][0]}px,${tr[i][1]}px) rotate(${n1(rs[i])}deg)}`));
    }
  });
  const kids={};N.forEach(n=>{(kids[n.p||'']=kids[n.p||'']||[]).push(n)});
  function render(n){
    const o=ref.org[n.id],e=ref.end[n.id];let s='';
    if(n.len>0&&!n.hide)s+=ln(o[0],o[1],e[0],e[1],n.cls||'b');
    if(n.x)s+=n.x(e,ref.abs[n.id]);
    (kids[n.id]||[]).forEach(k=>{s+=render(k)});
    if(moving[n.id])return `<g class="fg" style="transform-origin:${n1(o[0])}px ${n1(o[1])}px;animation-name:${name}_${n.id}">${s}</g>`;
    return `<g>${s}</g>`;
  }
  let cab='';
  (d.cables||[]).forEach((c,i)=>{
    const P=c.P,E=fr.map(f=>f.end[c.node]);
    const v0=[E[0][0]-P[0],E[0][1]-P[1]],l0=Math.hypot(v0[0],v0[1]),a0=Math.atan2(v0[1],v0[0]);
    css+=kf(`${name}_cb${i}`,Ps.map((q,k)=>{
      const v=[E[k][0]-P[0],E[k][1]-P[1]];
      return `${q.t}%{transform:rotate(${n1((Math.atan2(v[1],v[0])-a0)/R)}deg) scale(${(Math.hypot(v[0],v[1])/l0).toFixed(3)})}`;
    }));
    cab+=`<line class="fg cb" style="transform-origin:${P[0]}px ${P[1]}px;animation-name:${name}_cb${i}" x1="${P[0]}" y1="${P[1]}" x2="${n1(E[0][0])}" y2="${n1(E[0][1])}"/>`;
  });
  let mv='';
  (d.movers||[]).forEach((m,i)=>{
    css+=kf(`${name}_mv${i}`,Ps.map((q,k)=>`${q.t}%{transform:translate(${m.d[k][0]}px,${m.d[k][1]}px)}`));
    mv+=`<g class="fg" style="animation-name:${name}_mv${i}">${m.svg}</g>`;
  });
  let body='';(kids['']||[]).forEach(n=>{body+=render(n)});
  const svg=`<svg class="fig" viewBox="0 0 140 100" aria-hidden="true" focusable="false" style="--dur:${d.dur||3}s">${d.pre||''}${cab}${mv}${body}${d.post||''}</svg>`;
  return{svg,css};
}

/* ---- movement patterns (side view, facing right unless noted) ---- */
const FIG={};
function squat(goblet){
  const lean=goblet?28:40;
  return{dur:3.4,pre:F(90)+ln(54,90,72,90,'b'),
    nodes:[
      {id:'sh',at:[60,90],len:22,a:0},
      {id:'th',p:'sh',len:22,a:0},
      {id:'to',p:'th',len:28,a:0,x:goblet?e=>ln(e[0],e[1],e[0]+7,e[1]+9,'b')+`<rect class="eq" x="${n1(e[0]+4)}" y="${n1(e[1]+4)}" width="7" height="11" rx="2"/>`:e=>ci(e[0]-3,e[1]+2,6,'eq')},
      {id:'nk',p:'to',len:7,a:0,rel:1,x:hd}],
    poses:[{t:0,a:{sh:0,th:0,to:0}},{t:50,a:{sh:25,th:-84,to:lean}},{t:100,a:{sh:0,th:0,to:0}}]};
}
FIG.squat=squat(false);FIG.goblet=squat(true);

FIG.legpress={dur:3.2,
  pre:F(92)+ln(42.6,80.6,91.8,46.1,'fl')+ln(30,81,48,81,'pad')+ln(33.6,76.5,19.6,52.3,'pad'),
  movers:[{svg:ln(80.9,58.6,67.1,39,'eqp'),d:[[-13.1,9.1],[0,0],[-13.1,9.1]]}],
  nodes:[
    {id:'th',at:[38,74],len:22,a:55},
    {id:'sh',p:'th',len:22,a:55},
    {id:'to',at:[38,74],len:28,a:-30},
    {id:'nk',p:'to',len:7,a:-30,rel:1,x:hd}],
  poses:[{t:0,a:{th:4.7,sh:105.4}},{t:50,a:{th:55,sh:55}},{t:100,a:{th:4.7,sh:105.4}}]};

FIG.hinge={dur:3.4,pre:F(90)+ln(54,90,72,90,'b'),
  nodes:[
    {id:'sh',at:[60,90],len:22,a:0},
    {id:'th',p:'sh',len:22,a:0},
    {id:'to',p:'th',len:28,a:0},
    {id:'nk',p:'to',len:7,a:0,rel:1,x:hd},
    {id:'ar',p:'to',len:28,a:180,x:wt(5)}],
  poses:[{t:0,a:{sh:0,th:0,to:0,ar:180}},{t:50,a:{sh:8,th:-35,to:65,ar:190}},{t:100,a:{sh:0,th:0,to:0,ar:180}}]};

FIG.backext={dur:3.4,
  pre:F(92)+ln(58.5,48.5,43.7,63.3,'pad')+ln(44,66,36,92,'fl')+ln(58,52,70,92,'fl')+ci(24,76,3.5,'fl')+ln(24,80,24,92,'fl'),
  nodes:[
    {id:'lg',at:[55,45],len:44,a:225},
    {id:'to',at:[55,45],len:28,a:45},
    {id:'nk',p:'to',len:7,a:45,rel:1,x:hd}],
  poses:[{t:0,a:{to:120}},{t:50,a:{to:45}},{t:100,a:{to:120}}]};

FIG.bench={dur:3.2,
  pre:F(92)+ln(26,80,78,80,'pad')+ln(32,83,32,92)+ln(72,83,72,92)+ln(44,74,70,74,'b')+ln(70,74,91.3,68.3,'b')+ln(91.3,68.3,95.1,90,'b')+ln(89,90,102,90,'b')+ci(34,71,5,'hd'),
  nodes:[
    {id:'ua',at:[44,74],len:14,a:0},
    {id:'fa',p:'ua',len:14,a:0,x:wt(5.5)}],
  poses:[{t:0,a:{ua:0,fa:0}},{t:50,a:{ua:115,fa:-25}},{t:100,a:{ua:0,fa:0}}]};

FIG.incline={dur:3.2,
  pre:F(92)+ln(60,82,86,82,'pad')+ln(67.5,80.3,43.3,66.3,'pad')+ln(70,84,70,92)+ln(70,76,45.8,62,'b')+ci(38,57.5,5,'hd')+ln(70,76,91.7,72.2,'b')+ln(91.7,72.2,94,90,'b')+ln(88,90,101,90,'b'),
  nodes:[
    {id:'ua',at:[45.8,62],len:14,a:15},
    {id:'fa',p:'ua',len:14,a:15,x:wt(5.5)}],

const figCache={};let figStyle=null;
function figHTML(key){
  if(!figCache[key]){

      if(!figStyle){figStyle=document.createElement('style');document.head.appendChild(figStyle);}

    }
  }
  return figCache[key];
}

const $=(s,r)=>(r||document).querySelector(s);
const $$=(s,r)=>Array.from((r||document).querySelectorAll(s));
const fa=s=>String(s).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
const norm=s=>String(s).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٫,،]/g,'.');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function restLabel(s){return s>=120&&s%60===0?fa(s/60)+' دقیقه':fa(s)+' ثانیه';}

/* storage: every access guarded */
const mem={};
const store={
  get(k){let v=null;try{v=localStorage.getItem(k);}catch(e){}return v!=null?v:(k in mem?mem[k]:null);},
  set(k,v){mem[k]=v;try{localStorage.setItem(k,v);}catch(e){}if(typeof onDataChange==='function'&&k.startsWith('gym1|')&&k!=='gym1|ui')onDataChange(k);},
  del(k){delete mem[k];try{localStorage.removeItem(k);}catch(e){}}
};
const lkey=(p,w,d,id)=>`gym1|${p}|${w}|${d}|${id}`;
function getLog(p,w,d,id){
  let o=null;try{const r=store.get(lkey(p,w,d,id));if(r)o=JSON.parse(r);}catch(e){}
  if(!o||typeof o!=='object')o={};
  if(!Array.isArray(o.s))o.s=[];
  if(typeof o.kg!=='string')o.kg='';
  if(typeof o.r!=='string')o.r='';
  return o;
}
function putLog(p,w,d,id,o){try{store.set(lkey(p,w,d,id),JSON.stringify(o));}catch(e){}}
function lastTime(p,w,d,id){
  for(let k=w-1;k>=1;k--){const l=getLog(p,k,d,id);if(l.kg)return{kg:l.kg,r:l.r,w:k};}
  return null;
}

function cardioHTML(day){
  const m=S.person==='m';

function exCard(ex,idx,day){
  const extra=(S.week===3&&idx<2)?1:0;
  const n=ex.sets+extra;
  const log=getLog(S.person,S.week,day,ex.id);
  const lt=lastTime(S.person,S.week,day,ex.id);
  const bubs=Array.from({length:n},(_,i)=>`<button type="button" class="bub${log.s[i]?' on':''}" data-act="set" data-ex="${ex.id}" data-i="${i}" aria-pressed="${!!log.s[i]}" aria-label="ست ${fa(i+1)}">${fa(i+1)}</button>`).join('');

  return `<article class="card ex" data-card="${ex.id}">
  <div class="top"><div class="num">${fa(idx+1)}</div><div class="names"><h3>${esc(ex.fa)}</h3><div class="en">${esc(ex.en)}</div></div></div>

function resetHTML(){
  if(!S.confirm)return `<button type="button" class="btn" data-act="reset">پاک کردن این روز</button>`;
  return `<div class="conf card"><span>تیک ست‌های این روز (${PNAME[S.person]}، هفته ${fa(S.week)}) پاک بشه؟</span>
  <button type="button" class="btn dng" data-act="reset-sets">فقط ست‌ها</button>

}

function renderDay(){
  const d=S.day;
  if(d==='I'){$('#app').innerHTML=infoHTML();return;}
  const list=exList(d,S.person);
  const total=list.reduce((a,e,i)=>a+e.sets+((S.week===3&&i<2)?1:0),0);
  $('#app').innerHTML=`<div class="dayhead"><h2>${DAYS[d].title}</h2><p>برنامه‌ی ${PNAME[S.person]} · هفته ${fa(S.week)}</p></div>
  <div class="prog"><div class="row"><span id="pTxt"></span><span>${WEEKS[S.week].rir}</span></div><div class="bar"><i id="pBar"></i></div></div>
  ${list.map((e,i)=>exCard(e,i,d)).join('')}
  ${cardioHTML(d)}
  <div class="dayfoot" id="resetBox">${resetHTML()}</div>`;
  $('#app').dataset.total=total;
  updateProgress();
}
function updateProgress(){
  const tot=+$('#app').dataset.total||0;
  const done=$$('.bub.on').length;
  const t=$('#pTxt');if(!t)return;
  t.textContent=`${fa(done)} از ${fa(tot)} ست`;
  $('#pBar').style.width=(tot?Math.round(done*100/tot):0)+'%';
}

/* ================= body log + export ================= */
const PNAME_EN={m:'Mohammad',h:'Mahdi'};
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const bkey=(p,w)=>`gym1|body|${p}|${w}`;
function getBody(p,w){
  let o=null;try{const r=store.get(bkey(p,w));if(r)o=JSON.parse(r);}catch(e){}
  if(!o||typeof o!=='object')o={};
  if(typeof o.kg!=='string')o.kg='';
  if(typeof o.waist!=='string')o.waist='';
  return o;
}
function putBody(p,w,o){try{store.set(bkey(p,w),JSON.stringify(o));}catch(e){}}

function reportText(p){
  const L=[`Gym log - ${PNAME_EN[p]} - month 1 (start 2026-10-11) - exported ${today()}`,'','BODY (weekly avg weight kg / waist cm)'];
  for(let w=1;w<=4;w++){const b=getBody(p,w);L.push(`  Week ${w}: ${b.kg||'-'} kg / ${b.waist||'-'} cm`);}
  ['A','B','C'].forEach(d=>{
    L.push('',`DAY ${d}`);
    exList(d,p).forEach((ex,idx)=>{
      const parts=[];
      for(let w=1;w<=4;w++){
        const l=getLog(p,w,d,ex.id),n=ex.sets+((w===3&&idx<2)?1:0),done=l.s.filter(Boolean).length;
        if(l.kg||l.r||done)parts.push(`W${w}: ${l.kg||'-'}kg x ${l.r||'-'} (${done}/${n} sets${l.d?', '+l.d:''})`);
      }
      L.push(`  ${ex.en}: ${parts.length?parts.join(' | '):'not logged'}`);
    });
  });
  return L.join('\n');
}
function dumpAll(){
  const o={};
  try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith('gym1|')&&k!=='gym1|ui')o[k]=localStorage.getItem(k);}}catch(e){}
  for(const k in mem)if(k.startsWith('gym1|')&&k!=='gym1|ui'&&!(k in o))o[k]=mem[k];
  return o;
}
function exportPayload(){
  const p=S.person;
  const body=JSON.stringify({app:'gym-plan',v:1,person:PNAME_EN[p],exported:today(),report:reportText(p).split('\n'),data:dumpAll()},null,1);
  return {name:`gym-log-${PNAME_EN[p].toLowerCase()}-${today()}.json`,body};
}
function expMsg(t){const el=$('#expMsg');if(el)el.textContent=t;}
function downloadExport(){
  const x=exportPayload();
  try{
    const url=URL.createObjectURL(new Blob([x.body],{type:'application/json'}));
    const a=document.createElement('a');a.href=url;a.download=x.name;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),2000);
    expMsg('فایل دانلود شد: '+x.name);
  }catch(e){expMsg('دانلود نشد. از دکمه‌ی کپی متن استفاده کن.');}
}
async function shareExport(){
  const x=exportPayload();
  try{
    const f=new File([x.body],x.name,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:x.name});expMsg('ارسال شد.');return;}
  }catch(e){if(e&&e.name==='AbortError')return;}
  downloadExport();
}
async function copyReport(){
  const t=reportText(S.person);
  try{await navigator.clipboard.writeText(t);expMsg('متن کپی شد. توی تلگرام یا یادداشت paste کن.');return;}catch(e){}
  try{const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();expMsg('متن کپی شد.');}
  catch(e){expMsg('کپی نشد.');}
}
function importFile(file){
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const o=JSON.parse(rd.result);
      if(!o||o.app!=='gym-plan'||!o.data)throw 0;
      let n=0;for(const k in o.data)if(k.startsWith('gym1|')&&k!=='gym1|ui'&&typeof o.data[k]==='string'){store.set(k,o.data[k]);n++;}
      renderDay();expMsg(`بازیابی شد (${fa(n)} مورد).`);
    }catch(e){expMsg('این فایل خروجی همین برنامه نیست.');}
  };
  rd.readAsText(file);
}
function dataHTML(){
  const rows=[1,2,3,4].map(w=>{const b=getBody(S.person,w);return `<h4>هفته ${fa(w)}${w===S.week?' (این هفته)':''}</h4>
    <div class="logs">
      <label>وزن<input class="bw" inputmode="decimal" autocomplete="off" data-w="${w}" data-f="kg" value="${esc(b.kg)}" placeholder="۰" aria-label="میانگین وزن هفته ${w}"><span>کیلو</span></label>
      <label>شکم<input class="bw" inputmode="decimal" autocomplete="off" data-w="${w}" data-f="waist" value="${esc(b.waist)}" placeholder="۰" aria-label="دور شکم هفته ${w}"><span>سانت</span></label>
    </div>`;}).join('');
  return `<details class="card" open><summary>ثبت بدن و ذخیره برای برنامه‌ی بعدی</summary><div class="in">
    <p>هر جمعه <b>میانگین وزن هفته</b> و <b>دور شکم</b> (در ناف) را اینجا بنویس.</p>
    ${rows}
    <h4>خروجی گرفتن</h4>
    <p>همه‌ی وزنه‌ها، تکرارها، ست‌ها و اندازه‌ها روی همین گوشی ذخیره می‌شن. آخر هر هفته (یا حداقل آخر ماه) یک فایل خروجی بگیر و توی تلگرام بفرست. هم پشتیبان می‌مونه، هم برنامه‌ی ماه بعد از روی همین فایل ساخته می‌شه.</p>
    <div class="conf">
      <button type="button" class="btn pri" data-act="exp-share">ارسال فایل</button>
      <button type="button" class="btn" data-act="exp-dl">دانلود فایل</button>
      <button type="button" class="btn" data-act="exp-copy">کپی متن</button>
      <label class="btn" style="display:inline-flex;align-items:center;cursor:pointer">بازیابی از فایل<input id="imp" type="file" accept=".json,application/json" hidden></label>
    </div>
    <p class="note" id="expMsg" aria-live="polite"></p>
    <p class="note">گوشی عوض کردی یا مرورگر پاک شد؟ با «بازیابی از فایل» آخرین فایل خروجی را برگردون.</p>
  </div></details>`;
}

/* ================= GitHub Gist auto-sync ================= */
const SYNC_KEY='gym1sync';
function getSync(){let o=null;try{o=JSON.parse(store.get(SYNC_KEY)||'null');}catch(e){}return o&&typeof o==='object'?o:{};}
function putSync(o){try{localStorage.setItem(SYNC_KEY,JSON.stringify(o));}catch(e){}mem[SYNC_KEY]=JSON.stringify(o);}
const ownKey=(k,p)=>k.startsWith(`gym1|${p}|`)||k.startsWith(`gym1|body|${p}|`);
const gistFile=p=>`${PNAME_EN[p].toLowerCase()}.json`;
function syncPayload(p){
  const all=dumpAll(),data={};for(const k in all)if(ownKey(k,p))data[k]=all[k];
  return JSON.stringify({app:'gym-plan',v:1,person:PNAME_EN[p],updated:new Date().toISOString(),report:reportText(p).split('\n'),data},null,1);
}
async function gh(method,path,body){
  const c=getSync();
  const r=await fetch('https://api.github.com'+path,{method,headers:{'Authorization':'Bearer '+c.token,'Accept':'application/vnd.github+json'},body:body?JSON.stringify(body):undefined});
  if(!r.ok)throw new Error(r.status===401?'توکن نامعتبره یا منقضی شده':r.status===404?'گیست پیدا نشد':'خطای GitHub '+r.status);
  return r.json();
}
let syncT=null,syncBusy=false,syncState='';
function setSyncState(t){syncState=t;const el=$('#syncMsg');if(el)el.textContent=t;}
function onDataChange(k){
  const c=getSync();if(!c.token||!c.gist||!c.owner||!ownKey(k,c.owner))return;
  clearTimeout(syncT);syncT=setTimeout(pushSync,4000);setSyncState('تغییر ذخیره نشده…');
}
async function pushSync(){
  const c=getSync();if(!c.token||!c.gist||!c.owner)return;
  if(syncBusy){clearTimeout(syncT);syncT=setTimeout(pushSync,3000);return;}
  syncBusy=true;clearTimeout(syncT);syncT=null;
  try{
    await gh('PATCH','/gists/'+c.gist,{files:{[gistFile(c.owner)]:{content:syncPayload(c.owner)}}});
    c.last=new Date().toISOString();putSync(c);
    setSyncState('ذخیره شد در GitHub · '+fa(new Date().toTimeString().slice(0,5)));
  }catch(e){setSyncState('ذخیره نشد: '+(e.message||'اینترنت قطعه؟')+'. دوباره خودکار امتحان می‌شه.');}
  syncBusy=false;
}
/* pull: fills in anything this phone is missing (new phone / cleared browser); local data wins */
async function pullSync(){
  const c=getSync();if(!c.token||!c.gist||!c.owner)return;
  try{
    const g=await gh('GET','/gists/'+c.gist);
    const f=g.files&&g.files[gistFile(c.owner)];if(!f)return;
    let txt=f.content;if(f.truncated&&f.raw_url)txt=await (await fetch(f.raw_url)).text();
    const o=JSON.parse(txt);let n=0;
    if(o&&o.data)for(const k in o.data)if(ownKey(k,c.owner)&&typeof o.data[k]==='string'&&store.get(k)==null){mem[k]=o.data[k];try{localStorage.setItem(k,o.data[k]);}catch(e){}n++;}
    if(n)renderDay();
    setSyncState('همگام با GitHub'+(n?` · ${fa(n)} مورد بازیابی شد`:''));
  }catch(e){setSyncState('خطا در خواندن از GitHub: '+e.message);}
}
async function connectSync(){
  const tok=($('#syncTok').value||'').trim(),gid=($('#syncGist').value||'').trim().replace(/^.*\//,'');
  if(!tok){setSyncState('توکن را وارد کن.');return;}
  putSync({token:tok,gist:gid,owner:S.person});
  setSyncState('در حال اتصال…');
  try{
    if(!gid){
      const g=await gh('POST','/gists',{public:false,description:'Gym log - Mohammad & Mahdi',files:{[gistFile(S.person)]:{content:syncPayload(S.person)}}});
      putSync({token:tok,gist:g.id,owner:S.person});
    }else{await gh('GET','/gists/'+gid);await pullSync();await pushSync();}
    renderDay();setSyncState('وصل شد. از این به بعد خودکار ذخیره می‌شه.');
  }catch(e){putSync({});renderDay();setSyncState('وصل نشد: '+e.message);}
}
function syncHTML(){
  const c=getSync(),on=c.token&&c.gist&&c.owner;
  if(on)return `<details class="card" open><summary>ذخیره‌ی خودکار در GitHub</summary><div class="in">
    <p>✓ این گوشی مال <b>${PNAME[c.owner]}</b>ه و هر تغییر چند ثانیه بعد در فایل <b>${gistFile(c.owner)}</b> ذخیره می‌شه.</p>
    <div class="kv"><b>شناسه‌ی گیست</b><span style="direction:ltr;font-size:12px;user-select:all">${esc(c.gist)}</span></div>
    <p class="note">برای گوشی دوم همین شناسه را کپی کن تا هر دو در یک گیست ذخیره بشن.</p>
    <div class="conf"><button type="button" class="btn pri" data-act="sync-now">الان ذخیره کن</button><button type="button" class="btn" data-act="sync-off">قطع اتصال</button></div>
    <p class="note" id="syncMsg" aria-live="polite">${esc(syncState||(c.last?'آخرین ذخیره: '+fa(c.last.slice(0,16).replace('T',' ')):''))}</p>
  </div></details>`;
  return `<details class="card"><summary>ذخیره‌ی خودکار در GitHub</summary><div class="in">
    <p>یک بار تنظیم کن، بعد هر ست و وزنه خودکار در یک گیست خصوصی GitHub ذخیره می‌شه.</p>
    <ol>
      <li>اول بالای صفحه اسم خودت را انتخاب کن (این گوشی مال کیه).</li>
      <li>در GitHub: Settings → Developer settings → Personal access tokens → Fine-grained → Generate. در Account permissions فقط <b>Gists: Read and write</b> را بده.</li>
      <li>گوشی اول: توکن را بزن و شناسه را خالی بذار. گیست ساخته می‌شه.</li>
      <li>گوشی دوم: توکن خودش (یا همون توکن) + شناسه‌ی گیست گوشی اول.</li>
    </ol>
    <div class="logs"><label>توکن<input id="syncTok" type="password" autocomplete="off" placeholder="github_pat_…"></label></div>
    <div class="logs"><label>شناسه گیست<input id="syncGist" autocomplete="off" placeholder="خالی = گیست جدید"></label></div>
    <div class="conf" style="margin-top:10px"><button type="button" class="btn pri" data-act="sync-connect">اتصال</button></div>
    <p class="note" id="syncMsg" aria-live="polite">${esc(syncState)}</p>
    <p class="note">توکن فقط روی همین گوشی ذخیره می‌شه و فقط به گیست‌ها دسترسی داره.</p>
  </div></details>`;
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&syncT)pushSync();});

/* ================= rest timer ================= */
let timer=null,tint=null,tHide=null;
function mmss(s){const m=Math.floor(s/60),r=s%60;return fa(String(m).padStart(2,'0')+':'+String(r).padStart(2,'0'));}
function stopTimer(){
  if(tint){clearInterval(tint);tint=null;}
  if(tHide){clearTimeout(tHide);tHide=null;}
  timer=null;const b=$('#tbar');b.hidden=true;b.classList.remove('done');
}
function startRest(sec,name){
  stopTimer();
  timer={end:Date.now()+sec*1000,total:sec,name:name};
  const b=$('#tbar');b.hidden=false;b.classList.remove('done');
  $('#tname').textContent='استراحت: '+name;$('#tstop').textContent='توقف';$('#tadd').hidden=false;
  tick();tint=setInterval(tick,250);
}
function tick(){
  if(!timer)return;
  const left=Math.ceil((timer.end-Date.now())/1000);
  if(left<=0){
    clearInterval(tint);tint=null;
    $('#ttime').textContent=mmss(0);$('#tfill').style.width='100%';
    $('#tname').textContent='استراحت تموم شد، ست بعدی!';
    $('#tbar').classList.add('done');$('#tadd').hidden=true;$('#tstop').textContent='باشه';
    try{if(navigator.vibrate)navigator.vibrate([250,120,250,120,400]);}catch(e){}
    tHide=setTimeout(stopTimer,15000);
    return;
  }
  $('#ttime').textContent=mmss(left);
  $('#tfill').style.width=Math.min(100,Math.round((timer.total-left)*100/timer.total))+'%';
}

/* ================= events ================= */
function setUI(patch){Object.assign(S,patch);S.confirm=false;saveUI();renderControls();renderDay();}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;
  const a=t.dataset.act,v=t.dataset.v;
  if(a==='person')setUI({person:v});
  else if(a==='week')setUI({week:+v});
  else if(a==='day'){setUI({day:v});window.scrollTo(0,0);}
  else if(a==='set'){
    const list=exList(S.day,S.person),ex=list.find(x=>x.id===t.dataset.ex);if(!ex)return;
    const i=+t.dataset.i,log=getLog(S.person,S.week,S.day,ex.id);
    const idx=list.indexOf(ex),n=ex.sets+((S.week===3&&idx<2)?1:0);
    while(log.s.length<n)log.s.push(0);
    log.s[i]=log.s[i]?0:1;log.d=today();
    putLog(S.person,S.week,S.day,ex.id,log);
    t.classList.toggle('on',!!log.s[i]);t.setAttribute('aria-pressed',String(!!log.s[i]));
    updateProgress();
    if(log.s[i])startRest(ex.rest,ex.fa.length>28?ex.fa.slice(0,28)+'…':ex.fa);
  }
  else if(a==='reset'){S.confirm=true;$('#resetBox').innerHTML=resetHTML();}
  else if(a==='reset-cancel'){S.confirm=false;$('#resetBox').innerHTML=resetHTML();}
  else if(a==='reset-sets'||a==='reset-all'){
    exList(S.day,S.person).forEach(ex=>{
      if(a==='reset-all'){try{store.del(lkey(S.person,S.week,S.day,ex.id));}catch(er){}}
      else{const l=getLog(S.person,S.week,S.day,ex.id);l.s=[];putLog(S.person,S.week,S.day,ex.id,l);}
    });
    S.confirm=false;renderDay();
  }
  else if(a==='sync-connect')connectSync();
  else if(a==='sync-now')pushSync();
  else if(a==='sync-off'){clearTimeout(syncT);syncT=null;putSync({});syncState='';renderDay();}
  else if(a==='exp-share')shareExport();
  else if(a==='exp-dl')downloadExport();
  else if(a==='exp-copy')copyReport();
  else if(a==='tstop')stopTimer();
  else if(a==='tadd'&&timer){timer.end+=15000;timer.total+=15;tick();}
});
document.addEventListener('input',e=>{
  const t=e.target;if(!t.matches||!t.matches('input.kg,input.rp,input.bw'))return;
  const nv=norm(t.value);if(nv!==t.value)t.value=nv;
  if(t.classList.contains('bw')){
    const w=+t.dataset.w,b=getBody(S.person,w);b[t.dataset.f==='waist'?'waist':'kg']=nv;putBody(S.person,w,b);return;
  }
  const log=getLog(S.person,S.week,S.day,t.dataset.ex);
  if(t.classList.contains('kg'))log.kg=nv;else log.r=nv;
  log.d=today();
  putLog(S.person,S.week,S.day,t.dataset.ex,log);
});
document.addEventListener('change',e=>{
  const t=e.target;if(t&&t.id==='imp'&&t.files&&t.files[0]){importFile(t.files[0]);t.value='';}
});

if(typeof document!=='undefined'){renderControls();renderDay();pullSync();}
if(typeof globalThis!=='undefined'){globalThis.__GYM={FIG,fk,build,EX,CORE,exList};}
